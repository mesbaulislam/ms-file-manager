<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MS File Manager</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <symbol id="i-folder" viewBox="0 0 24 24">
      <path d="M2 7c0-1.1.9-2 2-2h5l2 2h9c1.1 0 2 .9 2 2v9c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2z" fill="#FFB52E"/>
      <path d="M2 9.5h20V18c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2z" fill="#E09A1F" opacity=".55"/>
    </symbol>
    <symbol id="i-img" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2" fill="#123A5C"/>
      <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="#50C8F5" stroke-width="1.6"/>
      <circle cx="9" cy="10" r="1.8" fill="#50C8F5"/>
      <path d="M4 18l5-5 3.5 3.5L16 13l4 4v1.5c0 .8-.7 1.5-1.5 1.5h-13C4.7 20 4 19.3 4 18.5z" fill="#50C8F5" opacity=".8"/>
    </symbol>
    <symbol id="i-vid" viewBox="0 0 24 24">
      <rect x="2.5" y="5" width="19" height="14" rx="3" fill="#C06AF3"/>
      <path d="M10.5 9.2l5.5 2.8-5.5 2.8z" fill="#0B192B"/>
    </symbol>
    <symbol id="i-aud" viewBox="0 0 24 24">
      <path d="M9.5 17.5a2.8 2.8 0 1 1-2-2.7V6.2l10-2.4v9.4a2.8 2.8 0 1 1-2-2.7V6.9l-6 1.4z" fill="#E86CB8"/>
    </symbol>
    <symbol id="i-doc" viewBox="0 0 24 24">

      <path d="M14 2.5v5h5z" fill="#B97A1A"/>
      <path d="M9 12h6M9 15h6M9 18h4" stroke="#7A4d0d" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-zip" viewBox="0 0 24 24">
      <rect x="5.5" y="2.5" width="13" height="19" rx="2" fill="#FFD23E"/>
      <path d="M12 2.5v19" stroke="#B98A00" stroke-width="1.4"/>
      <rect x="10.2" y="8" width="3.6" height="5" rx="1" fill="#B98A00"/>
      <path d="M8.5 6.5h7M8.5 17.5h7" stroke="#B98A00" stroke-width="1.2"/>
    </symbol>
    <symbol id="i-dl" viewBox="0 0 24 24">
      <path d="M12 3v10.5m0 0L7.5 9.5M12 13.5l4.5-4" stroke="#50C8F5" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 15.5V19c0 .8.7 1.5 1.5 1.5h13c.8 0 1.5-.7 1.5-1.5v-3.5" stroke="#50C8F5" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-music" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.5" fill="#3A2350"/>
      <path d="M10 15.8a2.3 2.3 0 1 1-1.6-2.2V7.4l7-1.7v6.6a2.3 2.3 0 1 1-1.6-2.2V8l-3.8.9z" fill="#C06AF3"/>
    </symbol>
    <symbol id="i-phone" viewBox="0 0 24 24">
      <rect x="7" y="2" width="10" height="20" rx="2.5" fill="none" stroke="#A9BCD2" stroke-width="1.8"/>
      <circle cx="12" cy="18.5" r="1.3" fill="#A9BCD2"/>
      <path d="M10 4.5h4" stroke="#A9BCD2" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-sd" viewBox="0 0 24 24">
      <path d="M7 2.5h6.5L19 8v13.5H7z" fill="none" stroke="#A9BCD2" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="13" y="16.5" font-size="7" font-family="sans-serif" font-weight="bold" text-anchor="middle" fill="#A9BCD2">SD</text>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#50C8F5" stroke-width="2.2"/>
      <path d="M15.5 15.5L21 21" stroke="#50C8F5" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-chev" viewBox="0 0 24 24">
      <path d="M9 5l7 7-7 7" fill="none" stroke="#8FA6C2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-back" viewBox="0 0 24 24">
      <path d="M15 5l-7 7 7 7" fill="none" stroke="#F4F8FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-info" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="#A9BCD2" stroke-width="1.8"/>
      <circle cx="12" cy="7.5" r="1.3" fill="#A9BCD2"/>
      <path d="M12 11v6" stroke="#A9BCD2" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M5 7h14M10 5h4M8 7l1 13h6l1-13" fill="none" stroke="#FF4D61" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10.5 10.5V17M13.5 10.5V17" stroke="#FF4D61" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-edit" viewBox="0 0 24 24">
      <path d="M4 20l1-4L16.5 4.5a1.8 1.8 0 0 1 2.5 0l.5.5a1.8 1.8 0 0 1 0 2.5L8 19z" fill="#50C8F5"/>

      <rect x="8" y="8" width="12" height="13" rx="2" fill="none" stroke="#A9BCD2" stroke-width="1.8"/>
      <path d="M5 15V5c0-1.1.9-2 2-2h8" fill="none" stroke="#A9BCD2" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-move" viewBox="0 0 24 24">
      <path d="M4 9h13m0 0l-3.5-3.5M17 9l-3.5 3.5M20 15H7m0 0l3.5-3.5M7 15l3.5 3.5" fill="none" stroke="#50C8F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-share" viewBox="0 0 24 24">
      <circle cx="6" cy="12" r="2.6" fill="#50C8F5"/>
      <circle cx="17" cy="5.5" r="2.6" fill="#50C8F5"/>
      <circle cx="17" cy="18.5" r="2.6" fill="#50C8F5"/>
      <path d="M8.3 10.8l6.4-4M8.3 13.2l6.4 4" stroke="#50C8F5" stroke-width="1.8"/>
    </symbol>
    <symbol id="i-open" viewBox="0 0 24 24">
      <path d="M6 3.5h8L19 8.5v12H6z" fill="#0E2A45" stroke="#50C8F5" stroke-width="1.6"/>
      <path d="M14 3.5v5h5" fill="#0E2A45" stroke="#50C8F5" stroke-width="1.6"/>
      <path d="M9.5 13.5l5-2.5-2 5.5z" fill="#50C8F5"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14" stroke="#50C8F5" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6L6 18" stroke="#A9BCD2" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="M4.5 12.5l5 5L19.5 7" fill="none" stroke="#3ED598" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-up" viewBox="0 0 24 24">
      <path d="M12 19V6m0 0l-6 6m6-6l6 6" fill="none" stroke="#FFB52E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3.2" fill="none" stroke="#A9BCD2" stroke-width="1.8"/>
      <path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1" stroke="#A9BCD2" stroke-width="1.8" stroke-linecap="round"/>

  </defs>
</svg>

<div id="app">
  <header id="hdr">
    <span id="hdr-ic"><svg><use xlink:href="#i-app" href="#i-app"/></svg></span>
    <span id="hdr-title">MS File Manager</span>
  </header>

  <main id="main">
    <!-- Screen 1: Home dashboard -->
    <section id="scr-home" class="screen">
      <div id="stor-cards"></div>
      <div id="cat-grid"></div>
      <div id="quick-list"></div>
    </section>

    <!-- Screens 2+3: folder/file browser (also used for Recent + categories) -->
    <section id="scr-browse" class="screen hidden">
      <div id="browse-list" class="list"></div>
    </section>

    <!-- Screen 5: file details -->
    <section id="scr-props" class="screen hidden">
      <div id="props-body"></div>
    </section>

    <!-- Screen 6: copy/move destination picker -->
    <section id="scr-picker" class="screen hidden">
      <div id="picker-crumb" class="crumb"></div>
      <div id="picker-list" class="list"></div>
    </section>

    <!-- Screen 7: search -->
    <section id="scr-search" class="screen hidden">
      <div id="search-bar">
        <svg class="sic"><use xlink:href="#i-search" href="#i-search"/></svg>
        <input id="search-input" type="text" maxlength="64" placeholder="Search files" autocomplete="off">
        <button id="search-clear" tabindex="-1"><svg><use xlink:href="#i-x" href="#i-x"/></svg></button>
      </div>
      <div id="search-hint" class="hint"></div>
      <div id="search-list" class="list"></div>
    </section>

    <!-- Screen 8: ZIP archive view -->
    <section id="scr-zip" class="screen hidden">
      <div id="zip-list" class="list"></div>
    </section>

    <!-- Settings -->
    <section id="scr-settings" class="screen hidden">
      <div id="settings-list" class="list"></div>
    </section>

    <!-- Text viewer -->
    <section id="scr-text" class="screen hidden">
      <pre id="text-body"></pre>
    </section>
  </main>

  <!-- Screen 4: file action popup menu (reused for all popup menus) -->
  <div id="menu-ov" class="overlay hidden">
    <div id="menu-box">
      <div id="menu-title">File Options</div>
      <div id="menu-list"></div>
    </div>
  </div>

  <!-- Generic dialog: confirm / prompt / message -->
  <div id="dlg-ov" class="overlay hidden">
    <div id="dlg-box">
      <div id="dlg-title"></div>
      <div id="dlg-msg"></div>
      <input id="dlg-input" type="text" maxlength="64" class="hidden">
      <div id="dlg-btns"></div>
    </div>
  </div>

  <!-- Busy / progress -->
  <div id="busy-ov" class="overlay hidden">
    <div id="busy-box"><div id="busy-spin"></div><div id="busy-msg">Working…</div></div>
  </div>

  <div id="toast" class="hidden"></div>

  <footer id="softkeys">
    <span id="sk-l"></span><span id="sk-c"></span><span id="sk-r"></span>
  </footer>
</div>

<script src="fake.js"></script>
<script src="driver.js"></script>
<script src="../js/filesystem.js"></script>
<script src="../js/operations.js"></script>
<script src="../js/archive.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
